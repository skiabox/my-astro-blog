<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Developer's Canvas">
    <defs>
        <linearGradient id="tile" x1="8" y1="5" x2="56" y2="59" gradientUnits="userSpaceOnUse">
            <stop stop-color="#111827" />
            <stop offset="1" stop-color="#050816" />
        </linearGradient>
        <linearGradient id="accent" x1="15" y1="16" x2="50" y2="49" gradientUnits="userSpaceOnUse">
            <stop stop-color="#67e8f9" />
            <stop offset="0.52" stop-color="#818cf8" />
            <stop offset="1" stop-color="#e879f9" />
        </linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)" />
    <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="url(#accent)" stroke-opacity=".48" stroke-width="2" />

    <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <path d="m25 20-11 12 11 12" stroke-width="5" />
        <path d="m39 20 11 12-11 12" stroke-width="5" />
        <path d="m36 16-8 32" stroke-width="4" />
    </g>

    <circle cx="50" cy="14" r="3" fill="#f0abfc" />
</svg>
